name: Python

on:
  push:
    branches: [main, master]
    paths:
      - "**.py"
      - "**.rs"
      - "**.ipynb"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - "Cargo.toml"
      - ".github/workflows/pytest.yml"
      - "pytest.ini"
  pull_request:
    paths:
      - "**.py"
      - "**.rs"
      - "**.ipynb"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - "Cargo.toml"
      - ".github/workflows/pytest.yml"
      - "pytest.ini"
  workflow_dispatch:

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }}${{ matrix.features && format(' +{0}', matrix.features) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        features: [""]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            features: "hdf5"

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.python-version }}

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          python-version: ${{ matrix.python-version }}
          os: ${{ matrix.os }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install maturin
        run: uv pip install maturin>=1.7.4

      - name: Build Rust extension
        run: |
          # Default builds use the minimal feature set.
          # The matrix include adds --features hdf5 on one Unix job so
          # the HDF5 code path is exercised in CI.
          if [ -n "${{ matrix.features }}" ]; then
            uv run maturin develop --release --features "${{ matrix.features }}"
          else
            uv run maturin develop --release
          fi
        shell: bash

      - name: Install Python dependencies
        run: |
          # On macOS, build h5py from source to ensure compatibility with system HDF5
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            export HDF5_DIR="${HDF5_DIR}"
            uv pip install --no-binary h5py "h5py>=3.8.0"
          fi
          # Install extra dependencies (evlib already installed by maturin develop above)
          # This will only install the dependencies from [all], not rebuild evlib
          uv pip install .[all]
        shell: bash

      - name: Debug - Find .pyd file location (Windows only)
        if: matrix.os == 'windows-latest'
        run: |
          echo "=== Searching entire workspace for evlib .pyd files ==="
          find . -name "evlib*.pyd" 2>/dev/null || echo "No evlib .pyd files found with find"
          echo ""
          echo "=== Checking sys.prefix/Lib/site-packages ==="
          python -c "import sys, os; sp = os.path.join(sys.prefix, 'Lib', 'site-packages'); print('Path:', sp); print('Exists:', os.path.isdir(sp))"
          python -c "import sys, os, glob; sp = os.path.join(sys.prefix, 'Lib', 'site-packages'); print('PYD files there:', glob.glob(os.path.join(sp, '*.pyd')))"
        shell: bash

      - name: Run tests
        run: |
          # Run pytest directly from venv instead of 'uv run' which creates isolated env
          pytest -v tests/ -m "not slow"
          pytest --nbmake examples/*.ipynb -v --no-cov
        shell: bash

      # Temporarily disabled - documentation tests need fixing
      # - name: Test documentation examples
      #   run: |
      #     source .venv/bin/activate
      #     uv run pytest --markdown-docs README.md docs/ -v --tb=short

      - name: Generate coverage report
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: pytest --cov=evlib --cov-report=xml -v tests/ -m "not slow"
        shell: bash

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

  # Local-only slow lane, made explicit and manually runnable. Several of
  # these tests (notably the RVT bit-identity acceptance suite) require
  # gitignored datasets that are absent on hosted runners, so they will
  # mostly skip here. This job exists to make the lane visible and to
  # provide a runnable target on a self-hosted runner with the datasets.
  slow:
    name: Slow (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: slow-ubuntu-latest

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          python-version: "3.12"
          os: ubuntu-latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install maturin
        run: uv pip install maturin>=1.7.4

      - name: Build Rust extension
        run: uv run maturin develop --release --features hdf5
        shell: bash

      - name: Install Python dependencies
        run: uv pip install .[all]
        shell: bash

      - name: Run slow tests
        run: pytest -v tests/ -m "slow" --run-slow
        shell: bash
