name: Python

on:
  push:
    branches: [main, master]
    paths:
      - "**.py"
      - "**.rs"
      - "**.ipynb"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - "Cargo.toml"
      - ".github/workflows/pytest.yml"
      - "pytest.ini"
  pull_request:
    paths:
      - "**.py"
      - "**.rs"
      - "**.ipynb"
      - "docs/**"
      - "README.md"
      - "pyproject.toml"
      - "Cargo.toml"
      - ".github/workflows/pytest.yml"
      - "pytest.ini"
  workflow_dispatch:

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.python-version }}

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          python-version: ${{ matrix.python-version }}
          enable-gstreamer: "true"
          os: ${{ matrix.os }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install maturin
        run: |
          source .venv/bin/activate
          uv pip install maturin>=1.7.4

      - name: Build evlib with HDF5 support
        run: |
          source .venv/bin/activate
          # Build with default features (includes python, polars, tracing, hdf5)
          maturin develop

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          # On macOS, build h5py from source to ensure compatibility with system HDF5
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            export HDF5_DIR="${HDF5_DIR}"
            uv pip install --no-binary h5py "h5py>=3.8.0"
          fi
          # Install remaining Python dependencies (skip build since we already built)
          uv pip install --no-build-isolation -e .[all]

      - name: Run tests
        run: |
          source .venv/bin/activate
          uv run pytest -v tests/ -m "not slow and not integration"
          uv run pytest --nbmake examples/*.ipynb -v --no-cov

      # Temporarily disabled - documentation tests need fixing
      # - name: Test documentation examples
      #   run: |
      #     source .venv/bin/activate
      #     uv run pytest --markdown-docs README.md docs/ -v --tb=short

      - name: Generate coverage report
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: |
          source .venv/bin/activate
          uv run pytest --cov=evlib --cov-report=xml -v tests/ -m "not slow and not integration"

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false
