name: Test Windows Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'pyproject.toml'
      - '.github/workflows/test-windows-build.yml'

jobs:
  test-windows-wheels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ['3.10', '3.11', '3.12']
        architecture: ['x64']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.python-version }}-${{ matrix.architecture }}

      - name: Install UV
        run: |
          pip install uv

      - name: Create virtual environment
        run: |
          uv venv --python ${{ matrix.python-version }}

      - name: Install maturin
        run: |
          .venv\Scripts\activate
          uv pip install maturin>=1.7.4

      - name: Build wheel (Windows - no HDF5)
        run: |
          .venv\Scripts\activate
          # Windows builds exclude HDF5 due to build complexity
          # Build with python and polars features only
          maturin build --release --features python,polars --interpreter python
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc

      - name: Install wheel
        run: |
          .venv\Scripts\activate
          pip install --find-links=target/wheels evlib
          pip install numpy polars pyarrow h5py hdf5plugin

      - name: Test import and basic functionality
        run: |
          .venv\Scripts\activate
          python -c "import evlib; print(f'evlib version: {evlib.__version__}')"
          python -c "import evlib.formats; print('formats module imported successfully')"
          python -c "import evlib.filtering; print('filtering module imported successfully')"
          python -c "import evlib.augmentation; print('augmentation module imported successfully')"

      - name: Test Polars integration
        run: |
          .venv\Scripts\activate
          python -c "import polars as pl; import evlib; print('Polars integration available')"

      - name: Verify HDF5 save is unavailable
        run: |
          .venv\Scripts\activate
          python -c "import evlib.formats; import inspect; funcs = [f for f in dir(evlib.formats) if not f.startswith('_')]; print(f'Available functions: {funcs}'); assert 'save_events_to_hdf5' not in funcs, 'HDF5 save should not be available on Windows'"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.architecture }}-py${{ matrix.python-version }}
          path: target/wheels/*.whl

      - name: Display wheel info
        run: |
          Get-ChildItem -Path target/wheels -Filter *.whl | ForEach-Object {
            Write-Host "Wheel: $($_.Name)"
            Write-Host "Size: $($_.Length) bytes"
          }

  summary:
    runs-on: ubuntu-latest
    needs: [test-windows-wheels]
    if: always()
    steps:
      - name: Build summary
        run: |
          echo "## Windows Build Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.test-windows-wheels.result }}" == "success" ]; then
            echo "✅ All Windows builds passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Windows wheels can be safely added to the publish workflow." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Windows builds failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
