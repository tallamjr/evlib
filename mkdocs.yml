site_name: evlib Documentation
site_description: High-performance event camera utilities in Rust with Python bindings
site_author: evlib Team
site_url: https://tallamjr.github.io/evlib/

repo_name: tallamjr/evlib
repo_url: https://github.com/tallamjr/evlib
edit_uri: edit/master/docs/

theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - navigation.sections
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.tabs.link
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.action.view

  icon:
    repo: fontawesome/brands/github
    logo: material/camera

  font:
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tallamjr/evlib
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/evlib/

plugins:
  - search:
      lang: en
  - tags
  - mike:
      canonical_version: latest

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Performance Guide: getting-started/performance.md
  - User Guide:
      - Loading Data: user-guide/loading-data.md
      - Formats: user-guide/formats.md
      - Filtering: user-guide/filtering.md
      - Event Representations: user-guide/representations.md
      - Polars Preprocessing: user-guide/polars-preprocessing.md
      - Prophesee ECF Codec: user-guide/prophesee-ecf.md
  - RVT Pipeline:
      - Overview: rvt/index.md
      - Conformance: rvt/conformance.md
  - Models & Training:
      - Overview: models/index.md
      - Datasets: models/datasets.md
      - Evaluation: models/evaluation.md
  - API Reference:
      - Core: api/core.md
      - Formats: api/formats.md
      - Filtering: api/filtering.md
      - Representations: api/representations.md
      - Processing: api/processing.md
      - Data Loading: api/data.md
      - Simulation: api/simulation.md
  - Examples:
      - Benchmarks: examples/benchmarks.md
      - Polars Preprocessing: examples/polars-preprocessing.md
  - Platform Support:
      - Windows: platform-support/windows.md
  - Logging: logging.md
  - Development:
      - Contributing: development/contributing.md
      - Architecture: development/architecture.md
      - DuckDB Integration: development/duckdb-integration.md
      - Testing: development/testing.md
      - Release Notes: development/releases.md

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/mathjax.js
