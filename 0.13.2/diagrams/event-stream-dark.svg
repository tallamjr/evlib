<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Tahoma, sans-serif">
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4B4B2"/>
    </marker>
  </defs>
  <text x="450" y="26" text-anchor="middle" font-size="18" fill="#E1E1DE">Event generation: log-intensity crossing the &#177;C contrast threshold</text>
  <!-- threshold and reference lines -->
  <line x1="60" y1="95" x2="840" y2="95" stroke="#FF9191" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="45" y="99" text-anchor="end" font-size="13" fill="#E1E1DE">+C</text>
  <line x1="60" y1="140" x2="840" y2="140" stroke="#B4B4B2" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="45" y="144" text-anchor="end" font-size="11" fill="#E1E1DE">L0</text>
  <line x1="60" y1="185" x2="840" y2="185" stroke="#8CBEFF" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="45" y="189" text-anchor="end" font-size="13" fill="#E1E1DE">-C</text>
  <text x="70" y="62" font-size="13" fill="#E1E1DE">log intensity L(t)</text>
  <!-- intensity trace, touching +C / -C at each event -->
  <polyline points="60,140 150,95 240,140 330,185 420,140 510,95 600,140 690,185 780,140 840,140"
            fill="none" stroke="#E1E1DE" stroke-width="2.5"/>
  <!-- event touch markers on the trace -->
  <circle cx="150" cy="95" r="4" fill="#FF9191"/>
  <circle cx="330" cy="185" r="4" fill="#8CBEFF"/>
  <circle cx="510" cy="95" r="4" fill="#FF9191"/>
  <circle cx="690" cy="185" r="4" fill="#8CBEFF"/>
  <!-- dashed drop-lines to the shared event axis -->
  <line x1="150" y1="99" x2="150" y2="312" stroke="#B4B4B2" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="330" y1="189" x2="330" y2="312" stroke="#B4B4B2" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="510" y1="99" x2="510" y2="312" stroke="#B4B4B2" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="690" y1="189" x2="690" y2="312" stroke="#B4B4B2" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- shared time axis -->
  <line x1="60" y1="320" x2="860" y2="320" stroke="#B4B4B2" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text x="875" y="325" font-size="14" fill="#E1E1DE">t</text>
  <!-- event markers on the axis -->
  <path d="M144,312 L156,312 L150,300 z" fill="#FF9191"/>
  <path d="M324,312 L336,312 L330,324 z" fill="#8CBEFF"/>
  <path d="M504,312 L516,312 L510,300 z" fill="#FF9191"/>
  <path d="M684,312 L696,312 L690,324 z" fill="#8CBEFF"/>
  <text x="150" y="345" text-anchor="middle" font-size="12" fill="#E1E1DE">(x, y, t, p=+1)</text>
  <text x="330" y="360" text-anchor="middle" font-size="12" fill="#E1E1DE">(x, y, t, p=-1)</text>
  <text x="510" y="345" text-anchor="middle" font-size="12" fill="#E1E1DE">(x, y, t, p=+1)</text>
  <text x="690" y="360" text-anchor="middle" font-size="12" fill="#E1E1DE">(x, y, t, p=-1)</text>
  <!-- legend -->
  <rect x="640" y="45" width="12" height="12" fill="#FF9191"/>
  <text x="658" y="55" font-size="12" fill="#E1E1DE">ON event (p = +1): crosses +C</text>
  <rect x="640" y="65" width="12" height="12" fill="#8CBEFF"/>
  <text x="658" y="75" font-size="12" fill="#E1E1DE">OFF event (p = -1): crosses -C</text>
</svg>
